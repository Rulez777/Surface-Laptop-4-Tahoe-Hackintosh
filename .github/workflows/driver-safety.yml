name: Driver pack safety
on:
  push:
    branches:
      - fix/driver-pack-preflight-and-nvram
  pull_request:
  workflow_dispatch:
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile scripts and tests
        run: python -m compileall -q scripts tests
      - name: Run offline safety tests
        run: python -m unittest discover -s tests -v
