name: SL4 Thermal Guard - Python policy tests
on:
  push:
    branches: [experimental/sl4-thermal-guard]
    paths:
      - 'scripts/thermal/**'
      - '.github/workflows/sl4-thermal-guard.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/thermal/**'
      - '.github/workflows/sl4-thermal-guard.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safe-policy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Syntax checks
        run: python3 -m py_compile scripts/thermal/sl4_thermal_guard.py scripts/thermal/install_smcprocessor_macos.py scripts/thermal/test_sl4_thermal_guard.py scripts/thermal/test_install_smcprocessor_macos.py
      - name: Validate original VirtualSMC 1.3.8 release archive format
        run: curl --fail --location --retry 2 --silent --show-error https://github.com/acidanthera/VirtualSMC/releases/download/1.3.8/VirtualSMC-1.3.8-RELEASE.zip -o /tmp/VirtualSMC-1.3.8-RELEASE.zip && python3 -c 'import pathlib,sys;sys.path.insert(0,"scripts/thermal");import install_smcprocessor_macos as m;print("SMCProcessor verified:",len(m.parse_release(pathlib.Path("/tmp/VirtualSMC-1.3.8-RELEASE.zip"))),"files")'
      - name: Synthetic threshold, critical and SMC structure tests
        run: python3 -m unittest discover -s scripts/thermal -p 'test_*.py' -v
