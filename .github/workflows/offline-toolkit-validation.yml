name: Offline toolkit safety and reproducibility

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'data/**'
      - 'docs/**'
      - 'packages/**'
      - 'README.md'
      - '.github/workflows/offline-toolkit-validation.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-platform-tests:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Full mocked tests (macOS/Linux; no real ESP)
        if: runner.os != 'Windows'
        run: python -m unittest discover -s tests -q
      - name: Portable mocked tests (Windows; no macOS-only pwd imports)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          @('test_setup_workflow.py','test_offline_kit.py','test_stability_audit.py','test_thermal_tmp3.py','test_sleep_audit_macos.py','test_dvmt60.py','test_video_macos.py','test_power_audit_macos.py','test_ac_power_recovery.py') | ForEach-Object {
            python -m unittest discover -s tests -p $_ -q
            if ($LASTEXITCODE -ne 0) { throw "Portable test failed: $_" }
          }
      - name: Windows synthetic EFI end-to-end PowerShell workflow
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\Test-WindowsOffline.ps1
      - name: Build first deterministic offline package
        run: python scripts/build_offline_kit.py --out kit-a.zip
      - name: Build second deterministic offline package
        run: python scripts/build_offline_kit.py --out kit-b.zip
      - name: Verify package integrity and reproducibility
        run: |
          python scripts/build_offline_kit.py --out kit-a.zip --verify-only
          python -c "import hashlib,pathlib; h=lambda p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest(); assert h('kit-a.zip') == h('kit-b.zip'), 'Non-deterministic package'"
      - name: Upload non-personal offline toolkit artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: SL4-offline-preparation-toolkit
          path: kit-a.zip
          if-no-files-found: error
          retention-days: 30
      - name: Windows PowerShell entry point (read-only pin check)
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\Start-SL4.ps1 -Action VerifyPins
